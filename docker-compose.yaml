services:
  db:
    restart: always
    container_name: database
    image: postgres:16.1
    environment:
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/data-import:/data-import
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - ${PGPORT}:${PGPORT}
  endless:
    container_name: endless
    image: endless
    build:
      context: ./endless
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    develop:
      watch:
        - action: rebuild
          path: ./endless

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge